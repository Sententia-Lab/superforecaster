services:
  api:
    build:
      # Repo root, not ./backend — the Dockerfile's frontend-build stage needs to see
      # frontend/ too, so `docker compose up --build` needs no separate npm build step.
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    env_file: backend/.env
    environment:
      DATABASE_PATH: /app/data/superforecaster.db
      FRONTEND_DIR: /app/frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Dev-only: hot-reloading Vite server, not part of the default `docker compose up`.
  # Production still ships as one process — see ADR 47 — this just saves installing
  # Node locally. Run with `docker compose --profile dev up`.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    profiles: ["dev"]

volumes:
  sqlite_data:
