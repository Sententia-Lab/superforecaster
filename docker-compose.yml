services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      # The frontend is static files with no build step, so it is bind-mounted and
      # served by the API rather than built into an image of its own.
      - ./frontend:/app/frontend:ro
    env_file: backend/.env
    environment:
      DATABASE_PATH: /app/data/superforecaster.db
      FRONTEND_DIR: /app/frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  sqlite_data:
