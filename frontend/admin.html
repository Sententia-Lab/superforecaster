<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superforecaster — admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="hdr">
  <div class="mark">S</div>
  <div class="wordmark">Admin</div>
  <div class="spacer"></div>
  <button class="btn tiny" id="token"></button>
  <a class="btn tiny" href="/">← App</a>
</header>

<main class="main">
  <nav class="tabs" id="tabs"></nav>
  <div id="panel"></div>
</main>

<script src="api.js"></script>
<script>
/**
 * Moderation tables over the existing admin routes. Deliberately thin: this is the
 * part of the old Next.js app that had no design in the new mockup, so it is ported
 * as function rather than restyled as product.
 */
const TABS = [
  { id: "pending",   label: "Pending questions" },
  { id: "approved",  label: "Approved" },
  { id: "forecasts", label: "Forecasts" },
  { id: "digest",    label: "Monthly digest" },
];

let active = "pending";
let rows = [];
let note = "";

const el = (tag, attrs, ...kids) => {
  const [name, ...cls] = tag.split(".");
  const n = document.createElement(name);
  if (cls.length) n.className = cls.join(" ");
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "class") n.className += " " + v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
};

const day = (s) => (s || "").slice(0, 10);

async function load() {
  note = "";
  try {
    if (active === "pending")   rows = await req("/questions?status=pending");
    if (active === "approved")  rows = await req("/questions?status=approved");
    if (active === "forecasts") rows = await req("/forecasts?limit=50");
    if (active === "digest")    rows = await req("/admin/digest/preview", { admin: true });
  } catch (e) {
    rows = [];
    note = e.detail || "Could not load.";
  }
  render();
}

async function act(fn, successMessage) {
  try { await fn(); note = successMessage; }
  catch (e) { note = e.detail || "Failed."; }
  await load();
}

function renderRow(r) {
  if (active === "forecasts") {
    return el("div.card", {},
      el("div.head", {},
        el("span.num", {}, `${Math.round((r.scored_probability ?? r.updates?.[0]?.probability ?? 0) * 100)}%`),
        el("span.chip", {}, r.category),
        el("span.micro", {}, `resolves ${day(r.resolution_date)}`),
        r.resolved_at ? el("span.chip.ok", {}, "resolved") : null,
        r.flagged_for_resolution_review ? el("span.chip.warn", {}, "flagged") : null),
      el("div", {}, r.question),
      el("div.actions", {},
        el("button.btn.tiny", { onClick: () => act(
          () => req(`/forecasts/${r.id}/refresh`, { method: "POST", admin: true }), "Refresh queued.") }, "Refresh"),
        !r.resolved_at ? el("button.btn.tiny", { onClick: () => act(
          () => req(`/forecasts/${r.id}/resolve`, { method: "PATCH", body: { outcome: 1.0 }, admin: true }), "Resolved YES.") }, "Resolve YES") : null,
        !r.resolved_at ? el("button.btn.tiny", { onClick: () => act(
          () => req(`/forecasts/${r.id}/resolve`, { method: "PATCH", body: { outcome: 0.0 }, admin: true }), "Resolved NO.") }, "Resolve NO") : null,
        !r.resolved_at ? el("button.btn.tiny.ghost", { onClick: () => act(
          () => req(`/forecasts/${r.id}/resolve`, { method: "PATCH", body: { outcome: null }, admin: true }), "Marked ambiguous.") }, "Ambiguous") : null));
  }

  return el("div.card", {},
    el("div.head", {},
      el("span.chip", {}, r.status),
      el("span.micro", {}, `net ${r.net_score}`),
      el("span.micro", {}, `proposed ${day(r.proposed_resolution_date)}`)),
    el("div", {}, r.text),
    el("div.dim", {}, r.resolution_criteria),
    el("div.actions", {},
      r.status === "pending" ? el("button.btn.tiny", { onClick: () => act(
        () => req(`/questions/${r.id}/approve`, { method: "POST", body: {}, admin: true }), "Approved.") }, "Approve") : null,
      r.status === "pending" ? el("button.btn.tiny.ghost", { onClick: () => act(
        () => req(`/questions/${r.id}/reject`, { method: "POST", admin: true }), "Rejected.") }, "Reject") : null,
      r.status === "approved" && !r.forecast_id ? el("button.btn.tiny", { onClick: () => act(
        () => req(`/questions/${r.id}/forecast`, { method: "POST", admin: true }), "Forecast running — this blocks until it lands.") }, "Forecast now") : null,
      r.forecast_id ? el("a.btn.tiny", { href: `/#${r.forecast_id}` }, "View forecast") : null));
}

function render() {
  document.getElementById("token").textContent = getAdminToken() ? "Token ✓" : "Set token";
  document.getElementById("tabs").replaceChildren(...TABS.map((t) =>
    el("button.tab", { class: t.id === active ? "on" : "", onClick: () => { active = t.id; load(); } }, t.label)));

  // `replaceChildren` is raw DOM and stringifies nulls instead of skipping them the
  // way `el` does, so conditional children have to be filtered out first.
  document.getElementById("panel").replaceChildren(...[
    note ? el("div.note", {}, note) : null,
    active === "digest" ? el("div.actions", {},
      el("button.btn", { onClick: () => act(
        () => req("/admin/digest/run", { method: "POST", admin: true }), "Digest run — top questions promoted.") }, "Run digest now"),
      el("button.btn", { onClick: () => act(
        () => req("/admin/refresh/run", { method: "POST", admin: true }), "Daily refresh started.") }, "Run daily refresh")) : null,
    rows.length === 0 ? el("div.empty", {}, "Nothing here.") : null,
    ...rows.map(renderRow),
  ].filter(Boolean));
}

document.getElementById("token").addEventListener("click", () => {
  const t = window.prompt("Admin token:", getAdminToken() || "");
  if (t !== null) { setAdminToken(t.trim() || null); load(); }
});

if (window.matchMedia?.("(prefers-color-scheme: dark)").matches) {
  document.documentElement.setAttribute("data-theme", "dark");
}
load();
</script>
</body>
</html>
