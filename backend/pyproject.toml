[project]
name = "superforecaster"
version = "0.3.0"
description = "Crowd-sourced superforecasting platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "logfire[system-metrics]>=4.25.0",
    "pre-commit>=4.6.1",
    "pydantic>=2.10.0",
    # Bounded on both sides, because both sides bite. A floor so low it says nothing lets
    # a clean install resolve a major the code was never written for, and that is how the
    # 1.x -> 2.x break arrived: `Graph()` stopped taking `nodes=`/`run_end_type=`, and the
    # wheel installed and then failed on `import superforecaster.update`. The lockfile hid
    # it from everyone working in a checkout.
    #
    # 2.x is where the agentic evaluators live (`MaxToolCalls`, `MaxModelRequests`), so
    # the migration happened. `pydantic-evals` pins `pydantic-ai-slim` to its exact
    # version, so these two move together or not at all.
    "pydantic-ai>=2.27.1,<3",
    "pydantic-evals>=2.27.1,<3",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.3.4",
    "typer>=0.24.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
superforecaster = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["superforecaster", "api", "app"]
