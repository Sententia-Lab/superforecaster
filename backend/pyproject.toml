[project]
name = "superforecaster"
version = "0.3.0"
description = "Crowd-sourced superforecasting platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "logfire>=4.25.0",
    "pydantic>=2.10.0",
    "pydantic-ai>=0.4.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["superforecaster", "api"]
