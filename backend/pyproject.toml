[project]
name = "superforecaster"
version = "0.3.0"
description = "Crowd-sourced superforecasting platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "logfire[system-metrics]>=4.25.0",
    "pre-commit>=4.6.1",
    "pydantic>=2.10.0",
    # Bounded on both sides, because both sides bite. `pydantic-ai>=0.4.0` was a floor
    # so low it said nothing, and with no ceiling a fresh install resolved 2.x, where
    # `Graph()` no longer takes `run_end_type` — the wheel installed and then failed on
    # `import superforecaster.update`. Nothing in this repo caught it: the lockfile
    # pinned 1.87.0 for everyone who worked from a checkout. Moving to 2.x is a real
    # migration, not a version bump; until then this is the range the code is written for.
    "pydantic-ai>=1.87.0,<2",
    "pydantic-evals>=1.87.0,<2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.3.4",
    "typer>=0.24.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
superforecaster = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["superforecaster", "api", "app"]
